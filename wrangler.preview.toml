name = "conform-preview"
account_id = "c038d1ab6b5acb96e4c34267d80c1c19"
main = "src/index.ts"
compatibility_date = "2026-07-21"
keep_vars = true
workers_dev = true

# Preview runs in the dedicated Centrst Cloudflare account. It is the
# smoke-test loop for release verification and the target for the conform-bench
# agent benchmark. Runs
# DELIVERY_MODE=arbitrary so verification emails come
# from the Worker itself and an IMAP harness can confirm them without touching
# the production Cloudflare destination-address allowance.
#
# Deploy manually: npx wrangler deploy --config wrangler.preview.toml

[vars]
DELIVERY_MODE = "arbitrary"
FROM_EMAIL = "forms@centrst.com"
FROM_NAME = "Centrist conForm"

[secrets]
required = [
  "ROUTE_TOKEN_SECRET",
  "OWNER_HASH_SECRET",
  "ACCOUNT_LOOKUP_SECRET",
]

[[send_email]]
name = "EMAIL"

[[ratelimits]]
name = "REGISTRATION_RATE_LIMITER"
namespace_id = "17001"

[ratelimits.simple]
limit = 5
period = 60

[[durable_objects.bindings]]
name = "QUOTAS"
class_name = "InboxQuota"

[[durable_objects.bindings]]
name = "ROUTES"
class_name = "FormRoute"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InboxQuota"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FormRoute"]
