name = "centrst-conform-mcp"
account_id = "c038d1ab6b5acb96e4c34267d80c1c19"
main = "mcp/src/index.ts"
compatibility_date = "2026-07-21"
keep_vars = true
workers_dev = false

# Zone routes take precedence over the engine's Custom Domain on the same
# hostname, so /mcp* reaches this worker while everything else stays with the
# delivery engine. Runtime values are managed in the Cloudflare dashboard.

[[routes]]
pattern = "api.conform.centrst.com/mcp*"
zone_name = "centrst.com"
