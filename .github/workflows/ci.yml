name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: npx wrangler deploy --dry-run
      - run: npx wrangler deploy --dry-run --config wrangler.centrst.toml
      - run: npx wrangler deploy --dry-run --config wrangler.centrst-staging.toml
