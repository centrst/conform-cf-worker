name = "conform-worker"
account_id = "c038d1ab6b5acb96e4c34267d80c1c19"
main = "src/index.ts"
compatibility_date = "2026-07-21"
keep_vars = true
workers_dev = false

# Runtime values are declared here, not left to the Cloudflare dashboard.
# Renaming this Worker (conform-cf-worker -> conform-worker) created a new
# script, and dashboard-set vars do not follow a rename -- production came up
# with no vars at all and returned config_incomplete for every route creation.
# keep_vars = true still preserves anything set out-of-band on top of these.
[vars]
DELIVERY_MODE = "verified"
# Transactional mail sends from a dedicated subdomain so its SPF/DKIM and
# sending reputation stay separate from the Zoho mail on the apex.
# One static From for every message; the submitter travels in Reply-To
# (src/submission.ts -> src/email.ts). Encoding the form id in the local
# part (notify+<form_id>@, as web3forms does) would add per-form bounce
# attribution and inbox filtering -- deliberately deferred, not needed for
# delivery.
FROM_EMAIL = "notify@conform.centrst.com"
FROM_NAME = "ConForm"
PUBLIC_URL = "https://api.conform.centrst.com"
SOURCE_URL = "https://github.com/centrst/conform-cf-worker"
CLOUDFLARE_ACCOUNT_ID = "c038d1ab6b5acb96e4c34267d80c1c19"
# The MCP server is served from this Worker at /mcp. Setting this makes
# the descriptor and llms.txt advertise it; unset, it works but is
# undiscoverable.
MCP_URL = "https://api.conform.centrst.com/mcp"
# The human-readable docs, on the Centrst origin rather than a hostname of
# their own (centrst/conform, Worker centrst-com-conform). Same deal as
# MCP_URL: discovery.ts omits docs_url entirely when this is unset, and the
# llms.txt this Worker serves drops its "- Docs:" line -- so an agent that
# finds the API has no route to the prose explaining it. The site went live
# 2026-08-17; before that there was nothing to point at.
DOCS_URL = "https://centrst.com/conform/docs/"

[secrets]
required = [
  "ROUTE_TOKEN_SECRET",
  "OWNER_HASH_SECRET",
  "CLOUDFLARE_API_TOKEN",
  # The dashboard at apps.centrst.com authenticates the user with Clerk and
  # calls POST /v1/account/routes with this shared secret. Without it that
  # endpoint answers account_lookup_unavailable and "my forms" is empty.
  "ACCOUNT_LOOKUP_SECRET",
]

[[routes]]
pattern = "api.conform.centrst.com"
custom_domain = true

[[send_email]]
name = "EMAIL"

[[ratelimits]]
name = "REGISTRATION_RATE_LIMITER"
namespace_id = "17001"

[ratelimits.simple]
limit = 5
period = 60

[[durable_objects.bindings]]
name = "QUOTAS"
class_name = "InboxQuota"

[[durable_objects.bindings]]
name = "ROUTES"
class_name = "FormRoute"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InboxQuota"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FormRoute"]

# Retain logs. Without this a 500 leaves no trace: wrangler tail only shows
# live traffic, so a failure is gone the moment it happens.
[observability]
enabled = true

[[ratelimits]]
name = "SUBMISSION_RATE_LIMITER"
namespace_id = "17002"

[ratelimits.simple]
# A human submits a contact form once. Twenty a minute per form leaves room for
# a genuinely busy endpoint while stopping a bot dead; five a minute per client
# caps a single source across every form it has found.
limit = 20
period = 60

[[ratelimits]]
name = "THROTTLE_REPORT_LIMITER"
namespace_id = "17003"

[ratelimits.simple]
# Not a throttle: a sampler. One counter write per form per minute however hard
# an attack pushes, so recording an attack never becomes part of it.
limit = 1
period = 60
