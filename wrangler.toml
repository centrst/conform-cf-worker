name = "conform-cf-worker"
main = "src/index.ts"
compatibility_date = "2026-07-21"
keep_vars = true

# Runtime variables are intentionally not declared here. This prevents an
# upstream Git deployment from replacing values configured in the Cloudflare
# dashboard with example values. Self-hosters should add the [vars] block from
# README.md to their fork before deploying.

[secrets]
required = ["ROUTE_TOKEN_SECRET", "OWNER_HASH_SECRET"]

[[send_email]]
name = "EMAIL"

# Change any namespace_id below (17001-17005) if it is already used by another
# rate-limit binding in your Cloudflare account -- the IDs are account-scoped,
# not global. Counters are ephemeral and receive only opaque HMAC keys, never
# raw IP or email values.
[[ratelimits]]
name = "REGISTRATION_RATE_LIMITER"
namespace_id = "17001"

[ratelimits.simple]
limit = 5
period = 60

[[durable_objects.bindings]]
name = "QUOTAS"
class_name = "InboxQuota"

[[durable_objects.bindings]]
name = "ROUTES"
class_name = "FormRoute"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InboxQuota"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FormRoute"]

[[ratelimits]]
name = "SUBMISSION_RATE_LIMITER"
namespace_id = "17002"

[ratelimits.simple]
# Per form. Generous on purpose: a shared cap that is too tight turns two real
# visitors in the same minute into one lost enquiry, and the owner never hears
# about it. Five a minute still bounds a flood -- it takes a scraped endpoint
# from draining a 250 allowance in thirteen minutes to fifty.
limit = 5
period = 60

# Per client, per form. A separate binding because a binding carries one limit,
# which is why the asymmetry described here was never actually in effect: both
# keys ran against the same counter. A human submits to one form once; two
# survives a double-click. The key includes the form id so that one NAT gateway
# cannot exhaust a stranger's budget on a shared deployment.
[[ratelimits]]
name = "SUBMISSION_CLIENT_RATE_LIMITER"
namespace_id = "17004"

[ratelimits.simple]
limit = 2
period = 60

# Key rotation. Sized for CI, which mints once per build.
[[ratelimits]]
name = "ROTATION_RATE_LIMITER"
namespace_id = "17005"

[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "THROTTLE_REPORT_LIMITER"
namespace_id = "17003"

[ratelimits.simple]
# Not a throttle: a sampler. One counter write per form per minute however hard
# an attack pushes, so recording an attack never becomes part of it.
limit = 1
period = 60
