name = "conform-cf-worker"
main = "src/index.ts"
compatibility_date = "2026-07-21"
keep_vars = true

# Runtime variables are intentionally not declared here. This prevents an
# upstream Git deployment from replacing values configured in the Cloudflare
# dashboard with example values. Self-hosters should add the [vars] block from
# README.md to their fork before deploying.

[secrets]
required = ["ROUTE_TOKEN_SECRET", "OWNER_HASH_SECRET"]

[[send_email]]
name = "EMAIL"

# Change namespace_id if 17001 is already used by another rate-limit binding in
# your Cloudflare account. Counters are ephemeral and receive only opaque HMAC
# keys, never raw IP or email values.
[[ratelimits]]
name = "REGISTRATION_RATE_LIMITER"
namespace_id = "17001"

[ratelimits.simple]
limit = 5
period = 60

[[durable_objects.bindings]]
name = "QUOTAS"
class_name = "InboxQuota"

[[durable_objects.bindings]]
name = "ROUTES"
class_name = "FormRoute"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InboxQuota"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FormRoute"]

[[ratelimits]]
name = "SUBMISSION_RATE_LIMITER"
namespace_id = "17002"

[ratelimits.simple]
# A human submits a contact form once. Twenty a minute per form leaves room for
# a genuinely busy endpoint while stopping a bot dead; five a minute per client
# caps a single source across every form it has found.
limit = 20
period = 60

[[ratelimits]]
name = "THROTTLE_REPORT_LIMITER"
namespace_id = "17003"

[ratelimits.simple]
# Not a throttle: a sampler. One counter write per form per minute however hard
# an attack pushes, so recording an attack never becomes part of it.
limit = 1
period = 60
